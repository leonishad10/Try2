<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Support Tag Vault</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --tag-bg: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; }

    header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    h1 { font-size: 1.8rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .search-box { width: 100%; position: relative; }
    .search-box input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background-color: #0284c715;
      color: #fff;
      outline: none;
    }
    .search-box input:focus { box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea, input[type="file"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    textarea { resize: vertical; min-height: 80px; }

    button.btn-submit {
      grid-column: 1 / -1;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button.btn-submit:hover { opacity: 0.9; }

    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .item-notes { font-size: 0.9rem; color: var(--text-muted); white-space: pre-wrap; margin-bottom: 12px; background: #0f172a50; padding: 8px; border-radius: 4px; }
    
    .tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .tag {
      background: var(--tag-bg);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .item-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
    .btn-action { background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 0.85rem; }
    .btn-delete { color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ IT Support Tag Vault</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🚨 EMERGENCY SEARCH: Type tags (e.g. cisco, printer, server, pass) or title..." oninput="filterItems()" />
    </div>
  </header>

  <div class="form-card">
    <h3 style="margin-bottom: 15px;">➕ Add New Resource / File</h3>
    <form id="vaultForm" onsubmit="saveItem(event)">
      <div class="form-grid">
        <div class="input-group">
          <label>Title / Device Name *</label>
          <input type="text" id="title" placeholder="e.g. 2nd Floor Cisco Switch Login" required />
        </div>
        <div class="input-group">
          <label>TAGS (comma separated) *</label>
          <input type="text" id="tags" placeholder="e.g. cisco, switch, floor2, config, login" required />
        </div>
      </div>

      <div class="input-group">
        <label>Quick Note / Credentials / Instructions</label>
        <textarea id="notes" placeholder="IP: 192.168.1.1, User: admin, Pass: Key1234..."></textarea>
      </div>

      <div class="input-group">
        <label>Attach File (PDF, Image, Config, Doc)</label>
        <input type="file" id="fileInput" />
      </div>

      <button type="submit" class="btn-submit">Save to Vault</button>
    </form>
  </div>

  <h2>Saved Resources</h2>
  <div class="items-grid" id="itemsContainer" style="margin-top: 15px;"></div>
</div>

<script>
  let db;
  const request = indexedDB.open("ITSupportVaultDB", 1);

  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("vault")) {
      db.createObjectStore("vault", { keyPath: "id", autoIncrement: true });
    }
  };

  request.onsuccess = (e) => {
    db = e.target.result;
    loadItems();
  };

  request.onerror = (e) => console.error("Database error:", e);

  function saveItem(event) {
    event.preventDefault();
    const title = document.getElementById("title").value;
    const tagsRaw = document.getElementById("tags").value;
    const notes = document.getElementById("notes").value;
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    const tags = tagsRaw.split(",").map(t => t.trim().toLowerCase()).filter(t => t.length > 0);

    const newItem = {
      title,
      tags,
      notes,
      createdAt: new Date().toLocaleString()
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        newItem.fileData = e.target.result;
        newItem.fileName = file.name;
        newItem.fileType = file.type;
        storeToDB(newItem);
      };
      reader.readAsDataURL(file);
    } else {
      storeToDB(newItem);
    }
  }

  function storeToDB(item) {
    const transaction = db.transaction(["vault"], "readwrite");
    const store = transaction.objectStore("vault");
    store.add(item);

    transaction.oncomplete = () => {
      document.getElementById("vaultForm").reset();
      loadItems();
    };
  }

  function loadItems() {
    const transaction = db.transaction(["vault"], "readonly");
    const store = transaction.objectStore("vault");
    const request = store.getAll();

    request.onsuccess = () => {
      window.allVaultItems = request.result;
      renderItems(window.allVaultItems);
    };
  }

  function renderItems(items) {
    const container = document.getElementById("itemsContainer");
    container.innerHTML = "";

    if (items.length === 0) {
      container.innerHTML = "<p style='color: var(--text-muted);'>No items found matching your tags.</p>";
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "item-card";

      const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join("");
      
      let fileAttachment = "";
      if (item.fileData) {
        if (item.fileType && item.fileType.startsWith("image/")) {
          fileAttachment = `<div style="margin-bottom: 10px;"><img src="${item.fileData}" style="max-width:100%; border-radius:4px; max-height:150px; object-fit:cover;"/></div>`;
        }
        fileAttachment += `<a class="btn-action" href="${item.fileData}" download="${item.fileName}">📄 Download ${item.fileName}</a>`;
      }

      card.innerHTML = `
        <div>
          <div class="item-title">${escapeHtml(item.title)}</div>
          <div class="tags-list">${tagsHtml}</div>
          ${item.notes ? `<div class="item-notes">${escapeHtml(item.notes)}</div>` : ""}
          ${fileAttachment}
        </div>
        <div class="item-actions">
          <small style="color:var(--text-muted); font-size: 0.75rem;">${item.createdAt}</small>
          <button class="btn-action btn-delete" onclick="deleteItem(${item.id})">Delete</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function filterItems() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    if (!query) {
      renderItems(window.allVaultItems || []);
      return;
    }

    const filtered = (window.allVaultItems || []).filter(item => {
      const matchTitle = item.title.toLowerCase().includes(query);
      const matchNotes = item.notes && item.notes.toLowerCase().includes(query);
      const matchTags = item.tags.some(tag => tag.includes(query));
      return matchTitle || matchNotes || matchTags;
    });

    renderItems(filtered);
  }

  function deleteItem(id) {
    if (!confirm("Are you sure you want to delete this item?")) return;
    const transaction = db.transaction(["vault"], "readwrite");
    const store = transaction.objectStore("vault");
    store.delete(id);
    transaction.oncomplete = () => loadItems();
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }
</script>
</body>
</html>
